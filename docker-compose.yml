# BjDrive — orchestration complète (base de données + API + application web)
#
#   docker compose up --build
#   → API    : http://localhost:3007/api
#   → Web    : http://localhost:8080
#   → DB     : localhost:5432 (postgres/postgis)
#
# Renseignez vos clés (JWT, KkiaPay) dans un fichier .env à la racine
# (voir backend/.env.example).

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: bjdrive-db
    environment:
      POSTGRES_USER: bjdrive
      POSTGRES_PASSWORD: bjdrive
      POSTGRES_DB: bjdrive
    ports:
      # 5433 côté hôte pour éviter le conflit avec d'autres Postgres locaux ;
      # l'API joint la base via le réseau interne (db:5432) quoi qu'il arrive.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bjdrive -d bjdrive"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: bjdrive-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # NODE_ENV=production active les garde-fous (paiement simulé interdit...).
      NODE_ENV: "${NODE_ENV:-development}"
      DATABASE_URL: "postgresql://bjdrive:bjdrive@db:5432/bjdrive?schema=public"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me}"
      # Access token court : le frontend se renouvelle seul via /auth/refresh.
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-1h}"
      REFRESH_EXPIRES_DAYS: "${REFRESH_EXPIRES_DAYS:-30}"
      SUPERADMIN_EMAIL: "${SUPERADMIN_EMAIL:-admin@bjdrive.bj}"
      SUPERADMIN_PASSWORD: "${SUPERADMIN_PASSWORD:-changez-moi}"
      SUPERADMIN_NAME: "Super Admin"
      COMMISSION_RATE: "0.10"
      MAX_DELIVERIES_PER_DAY: "5"
      DEFAULT_BASE_DELIVERY_FEE: "500"
      DEFAULT_PER_KM_FEE: "100"
      KKIAPAY_PUBLIC_KEY: "${KKIAPAY_PUBLIC_KEY:-}"
      KKIAPAY_PRIVATE_KEY: "${KKIAPAY_PRIVATE_KEY:-}"
      KKIAPAY_SECRET: "${KKIAPAY_SECRET:-}"
      KKIAPAY_SANDBOX: "${KKIAPAY_SANDBOX:-true}"
      # Secret partagé exigé sur le webhook KkiaPay (header x-webhook-secret ou ?token=)
      KKIAPAY_WEBHOOK_SECRET: "${KKIAPAY_WEBHOOK_SECRET:-}"
      # Notifications Web Push — générez les clés : npx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:admin@bjdrive.bj}"
      # E-mails de facture (désactivés si SMTP_HOST vide)
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-BjDrive <no-reply@bjdrive.bj>}"
      # Supervision des erreurs (facultatif)
      SENTRY_DSN: "${SENTRY_DSN:-}"
      PORT: "3007"
      CORS_ORIGIN: "http://localhost:5173,http://localhost:8080"
      # URL de l'application web (liens dans les e-mails : réinitialisation...)
      WEB_APP_URL: "${WEB_APP_URL:-http://localhost:8080}"
    ports:
      - "3007:3007"
    volumes:
      # Photos produits/enseignes uploadées
      - uploads:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:3007/api}"
        VITE_SOCKET_URL: "${VITE_SOCKET_URL:-http://localhost:3007}"
        VITE_KKIAPAY_PUBLIC_KEY: "${VITE_KKIAPAY_PUBLIC_KEY:-}"
        VITE_GOOGLE_MAPS_API_KEY: "${VITE_GOOGLE_MAPS_API_KEY:-}"
        # Numéro WhatsApp du support (ex: 22997000000, sans +) — masqué si vide
        VITE_SUPPORT_WHATSAPP: "${VITE_SUPPORT_WHATSAPP:-}"
    container_name: bjdrive-web
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
